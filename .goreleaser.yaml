# Builds release binaries when a vX.Y.Z tag is pushed (see .github/workflows/release.yml).
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: security-dashboard

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: security-dashboard
    main: .
    binary: security-dashboard
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/health-report-guide.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
